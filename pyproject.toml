[project]
name = "prospexia"
version = "0.1.0"
description = "Prospection d'entreprises à faible présence en ligne (création de site web / SEO)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8",
    "httpx>=0.27",
    "deep-translator>=1.11",
    "openpyxl>=3.1",
    "platformdirs>=4.0",
]

[project.scripts]
prospexia = "prospexia.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prospexia"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501", "E701", "E702"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
